[package]
name = "just_a_language_server"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = {version="1.0.228", features=["derive"]}
serde_json = "1.0.145"
serde_repr = "0.1.20"
bytes = "1.10.1"
tokio = {version="1.48.0", features=["full"]}
tokio-util = {version="0.7.16", features=["codec"]}
futures = "0.3.31"
log = "0.4.28"
env_logger = "0.11.8"
serde_with = "3.15.1"
